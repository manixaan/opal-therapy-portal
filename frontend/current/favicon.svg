<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Opa — the Opal Therapy living-cell mark (matches .brand-pebble / #opa-fab) -->
  <defs>
    <linearGradient id="opa-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2aa792"/>
      <stop offset="0.58" stop-color="#0f7c6c"/>
      <stop offset="1" stop-color="#cf7b57"/>
    </linearGradient>
  </defs>
  <!-- organic membrane: asymmetric blob echoing border-radius 58% 42% 52% 48% / 50% 58% 42% 50% -->
  <path fill="url(#opa-g)" d="M 52 4
    C 75 5 96 21 96 48
    C 96 75 76 96 47 96
    C 22 96 4 77 4 49
    C 4 23 26 3 52 4 Z"/>
  <!-- nucleus -->
  <ellipse cx="46" cy="41" rx="17" ry="15" fill="#ffffff" opacity="0.55"
           transform="rotate(-12 46 41)"/>
</svg>
