<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in to Opa — Opal Therapy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0f7c6c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #0f7c6c;
      --brand-dark:  #0a5d51;
      --ink:         #241f1a;
      --ink-soft:    #5d564e;
      --surface:     #ffffff;
      --bg:          #faf6f0;
      --border:      #e9e3d9;
      --danger:      #c2412e;
      --radius:      12px;
      --shadow:      0 4px 24px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    /* ── Opa — the living-cell mark (same organism as the app header):
       the membrane morphs and sways while the nucleus drifts inside.
       Slow, small, and collapsed entirely by prefers-reduced-motion. ── */
    .brand-pebble {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #2aa792 0%, #0f7c6c 58%, #cf7b57 108%);
      border-radius: 58% 42% 52% 48% / 50% 58% 42% 50%;
      display: inline-block; position: relative;
      animation: pebbleMorph 8s ease-in-out infinite, pebbleSway 13s ease-in-out infinite;
      cursor: pointer;
    }
    .brand-pebble::after {
      content: ""; position: absolute; left: 30%; top: 26%;
      width: 34%; height: 30%;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 60% 40% 55% 45% / 55% 60% 40% 45%;
      animation: pebbleDrift 8s ease-in-out infinite;
    }
    @keyframes pebbleMorph {
      0%, 100% { border-radius: 58% 42% 52% 48% / 50% 58% 42% 50%; }
      25%      { border-radius: 42% 58% 62% 38% / 58% 42% 58% 42%; }
      50%      { border-radius: 52% 48% 40% 60% / 42% 58% 44% 58%; }
      75%      { border-radius: 62% 38% 52% 48% / 52% 40% 60% 44%; }
    }
    @keyframes pebbleSway {
      0%, 100% { transform: rotate(0deg)  scale(1); }
      28%      { transform: rotate(-5deg) scale(1.05); }
      58%      { transform: rotate(4deg)  scale(0.96); }
      82%      { transform: rotate(-2deg) scale(1.02); }
    }
    @keyframes pebbleDrift {
      0%, 100% { left: 30%; top: 26%; border-radius: 60% 40% 55% 45% / 55% 60% 40% 45%; }
      25%      { left: 38%; top: 34%; border-radius: 45% 55% 48% 52% / 52% 45% 55% 48%; }
      50%      { left: 27%; top: 36%; border-radius: 55% 45% 60% 40% / 48% 55% 45% 60%; }
      75%      { left: 24%; top: 27%; border-radius: 48% 52% 42% 58% / 58% 48% 52% 42%; }
    }
    .brand-opa {
      background: linear-gradient(105deg, #0a5d51 0%, #0f7c6c 52%, #d96f4e 118%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: #0a5d51;
    }
    /* Opa's greeting — appears under the cell, then politely fades */
    .opa-greet {
      font-size: 13px; color: var(--ink-soft); margin-top: 10px;
      opacity: 0; transform: translateY(-3px);
      transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .opa-greet.show { opacity: 1; transform: none; }
    .opa-greet .og-name { color: #0a5d51; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .opa-greet { opacity: 1; transform: none; }
    }
    .logo-mark {
      width: 48px;
      height: 48px;
      background: var(--brand);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .logo-mark svg { width: 26px; height: 26px; fill: white; }
    .logo h1 { font-size: 20px; font-weight: 700; color: var(--ink); }
    .logo p  { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus { border-color: var(--brand); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover  { background: var(--brand-dark); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-box {
      background: #fdf1ee;
      border: 1px solid #eeb3a4;
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-box.visible { display: block; }

    .divider {
      text-align: center;
      color: var(--ink-soft);
      font-size: 12px;
      margin: 24px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 28px);
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--brand);
      text-decoration: none;
      margin-top: 5px;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    .info-box {
      background: #e8eff9;
      border: 1px solid #c3d4ec;
      color: #3d6cae;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .info-box.visible { display: block; }

    .footer-note {
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-top: 28px;
      line-height: 1.5;
    }

    /* Loading spinner */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="brand-pebble" id="opa-pebble" role="img" aria-label="Opa, the Opal Therapy assistant"></div>
    <h1>Log in to <span class="brand-opa">Opa</span></h1>
    <p>Opal Therapy · Scheduling &amp; Practice Management</p>
    <div class="opa-greet" id="opa-greet">Hi, I'm <span class="og-name">Opa</span>! Good to see you.</div>
  </div>

  <div class="info-box"  id="info-box"  role="status"></div>
  <div class="error-box" id="error-box" role="alert"></div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />
      <a href="/forgot-password" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn-primary" id="login-btn">
      <span class="btn-label">Sign in</span>
      <span class="spinner"></span>
    </button>
  </form>

  <p class="footer-note">
    Your role and permissions are managed by the practice owner.<br>
    Contact your administrator if you cannot log in.
  </p>
  <p class="footer-note" style="margin-top: 12px;">
    Don't have an account? <a href="/register" style="color: var(--brand); text-decoration: none; font-weight: 500;">Create account</a>
  </p>
</div>

<script>
  // ── Opa says hi — greeting fades in on arrival, and again on a click ──
  (function opaGreeting() {
    const greet = document.getElementById('opa-greet');
    const pebble = document.getElementById('opa-pebble');
    if (!greet) return;
    let hideTimer = null;
    const wave = function () {
      greet.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { greet.classList.remove('show'); }, 6000);
    };
    setTimeout(wave, 700);
    if (pebble) pebble.addEventListener('click', wave);
  })();

  // ── Handle ?reason= query param (redirected from server-side route guards) ──
  (function handleReasonParam() {
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason');
    if (reason === 'suspended') {
      showInfo('Your account has been suspended. Please contact the practice owner for assistance.');
    } else if (reason === 'deactivated') {
      showInfo('This account is no longer active. Please contact the practice owner if you believe this is a mistake.');
    } else if (reason === 'verified') {
      showInfo('Your email has been verified. You can now sign in.');
    } else if (reason === 'reset') {
      showInfo('Your password has been reset. You can now sign in with your new password.');
    }
  })();

  // ── If already authenticated, skip the login screen ────────────────────────
  (async function checkExistingSession() {
    try {
      const r = await fetch('/api/auth/me', { credentials: 'include' });
      if (r.ok) {
        const redirect = new URLSearchParams(window.location.search).get('next') || '/';
        window.location.replace(redirect);
      }
    } catch (_) {}
  })();

  // ── Handle login form submission ────────────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn      = document.getElementById('login-btn');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    clearMessages();

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const r = await fetch('/api/auth/login', {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'include',
        body:        JSON.stringify({ email, password }),
      });

      const json = await r.json().catch(() => ({}));

      if (r.ok && json.ok) {
        // Successful login — redirect to main app
        const redirect = new URLSearchParams(window.location.search).get('next') || '/';
        window.location.replace(redirect);
        return;
      }

      // Handle specific account-status error codes
      const code = json.code;
      if (code === 'pending_verification') {
        // Store email for resend flow, then redirect
        sessionStorage.setItem('pending_verification_email', email);
        window.location.replace('/verify-email?state=pending');
        return;
      }
      if (code === 'pending_approval') {
        window.location.replace('/pending-approval');
        return;
      }
      if (code === 'suspended') {
        showError('Your account has been suspended. Please contact the practice owner for assistance.');
        return;
      }
      if (code === 'deactivated') {
        showError('This account is no longer active. Please contact the practice owner if you believe this is a mistake.');
        return;
      }

      showError(json.error || 'Sign in failed. Please check your credentials and try again.');
    } catch (err) {
      showError('Could not connect to the server. Please check your connection.');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.classList.add('visible');
    document.getElementById('password').value = '';
  }

  function showInfo(msg) {
    const box = document.getElementById('info-box');
    box.textContent = msg;
    box.classList.add('visible');
  }

  function clearMessages() {
    document.getElementById('error-box').classList.remove('visible');
    document.getElementById('info-box').classList.remove('visible');
  }
</script>

</body>
</html>
