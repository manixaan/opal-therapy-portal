<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opal</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { --bg: #f6f8f7; --ink: #1d2b27; --muted: #5d6b66; --brand: #1f8a70; --card: #ffffff; --line: #dfe6e3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151a19; --ink: #e8eeec; --muted: #9aa8a3; --brand: #3fb393; --card: #1d2423; --line: #2c3533; }
    }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 32px; max-width: 420px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 18px; margin: 12px 0 6px; }
    p { color: var(--muted); margin: 0 0 16px; }
    .spin { width: 22px; height: 22px; margin: 8px auto 0; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    a.btn, button { display: inline-block; background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px;
                    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <img src="/icons/icon-192.png" alt="">
    <h1 id="title">Signing you in to Opal…</h1>
    <p id="detail">Using your Microsoft 365 account.</p>
    <div class="spin" id="spin"></div>
    <div id="actions" hidden>
      <button type="button" id="retry">Try again</button>
      <a class="btn" id="open" href="/" target="_blank" rel="noopener">Open Opal in the browser</a>
    </div>
  </main>
  <script src="/outlook-tab.js?v=1"></script>
</body>
</html>
