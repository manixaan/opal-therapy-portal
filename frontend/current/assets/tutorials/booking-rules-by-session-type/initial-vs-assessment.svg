<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">An initial assessment is only the first session with a new client; an assessment session covers trials, equipment trials and functional capacity assessments at any point</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Which assessment is it?</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Two session types that are easy to mix up</text><rect x="28" y="104" width="318" height="214" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><rect x="28" y="104" width="318" height="52" rx="18" fill="#23395B" stroke="#23395B" stroke-width="0"/><rect x="28" y="136" width="318" height="20" fill="#23395B"/><text x="187" y="138" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Initial assessment</text><text x="52" y="196" font-size="17" font-weight="700" fill="#23395B" text-anchor="start">Only for the first session</text><text x="52" y="220" font-size="17" font-weight="700" fill="#23395B" text-anchor="start">with a new client.</text><text x="52" y="268" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">Later assessment work is an</text><text x="52" y="289" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">assessment session.</text><rect x="374" y="104" width="318" height="214" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><rect x="374" y="104" width="318" height="52" rx="18" fill="#14988A" stroke="#14988A" stroke-width="0"/><rect x="374" y="136" width="318" height="20" fill="#14988A"/><text x="533" y="138" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Assessment session</text><circle cx="404" cy="186" r="11" fill="#14988A"/><path d="M397 186 L402 191 L411 181" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="424" y="192" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">Trials</text><circle cx="404" cy="220" r="11" fill="#14988A"/><path d="M397 220 L402 225 L411 215" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="424" y="226" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">Equipment trials</text><circle cx="404" cy="254" r="11" fill="#14988A"/><path d="M397 254 L402 259 L411 249" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="424" y="260" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">Functional capacity assessments</text><text x="398" y="300" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">At any point in a client’s time with us</text><rect x="28" y="336" width="664" height="46" rx="12" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="360" y="365" font-size="16" font-weight="700" fill="#0D5E57" text-anchor="middle">New client, and your first session with them? It is an initial assessment.</text>
</svg>
