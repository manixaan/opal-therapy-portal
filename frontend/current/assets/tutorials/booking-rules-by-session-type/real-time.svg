<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Sessions other than therapy are usually allocated an hour and charged at real time: a 75-minute session is charged as 75 minutes</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Allocate an hour, charge real time</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Sessions other than therapy</text><text x="60" y="128" font-size="16" font-weight="800" fill="#6B7C80" text-anchor="start">Booked</text><rect x="60" y="140" width="432.0" height="44" rx="10" fill="#fff" stroke="#23395B" stroke-width="2.5" stroke-dasharray="8 6"/><text x="276.0" y="168" font-size="16" font-weight="800" fill="#23395B" text-anchor="middle">Usually one hour</text><text x="60" y="222" font-size="16" font-weight="800" fill="#6B7C80" text-anchor="start">Actual time</text><rect x="60" y="234" width="540.0" height="44" rx="10" fill="#14988A"/><text x="330.0" y="262" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">75 minutes</text><path d="M492.0 192 V292" stroke="#D9614E" stroke-width="2.5" stroke-dasharray="5 5"/><rect x="504.0" y="182" width="150" height="34" rx="10" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="579.0" y="204" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">ran 15 min over</text><rect x="250" y="300" width="220" height="38" rx="19.0" fill="#0D5E57" stroke="#0D5E57" stroke-width="0"/><text x="360.0" y="325.6666666666667" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Charge 75 minutes</text><text x="360" y="374" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">Some sessions run over and some finish early. Charge the time you spent.</text>
</svg>
