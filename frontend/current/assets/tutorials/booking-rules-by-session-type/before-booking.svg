<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Before any session is booked, including telehealth, you need a signed service agreement and a client record showing funding hours available</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Before any session is booked</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Two things must be in place first</text><rect x="28" y="100" width="212" height="124" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><circle cx="62" cy="140" r="15" fill="#23395B"/><path d="M55 140 L60 145 L69 135" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="146" font-size="17" font-weight="800" fill="#23395B" text-anchor="start">Signed service</text><text x="88" y="170" font-size="17" font-weight="800" fill="#23395B" text-anchor="start">agreement</text><rect x="252" y="100" width="300" height="124" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><circle cx="286" cy="140" r="15" fill="#14988A"/><path d="M279 140 L284 145 L293 135" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="146" font-size="17" font-weight="800" fill="#14988A" text-anchor="start">Client record showing</text><text x="312" y="170" font-size="17" font-weight="800" fill="#14988A" text-anchor="start">funding hours available</text><path d="M560 162 H590" stroke="#0D5E57" stroke-width="4" stroke-linecap="round"/><path d="M584 153 L596 162 L584 171" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="602" y="100" width="90" height="124" rx="18" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="647" y="156" font-size="18" font-weight="800" fill="#0D5E57" text-anchor="middle">Then</text><text x="647" y="180" font-size="18" font-weight="800" fill="#0D5E57" text-anchor="middle">book</text><rect x="28" y="242" width="664" height="74" rx="14" fill="#ECEAF8" stroke="#ECEAF8" stroke-width="0"/><text x="52" y="274" font-size="17" font-weight="800" fill="#6C63C9" text-anchor="start">This applies to every session type, including telehealth.</text><text x="52" y="299" font-size="15" font-weight="600" fill="#6C63C9" text-anchor="start">Telehealth is charged against the client’s funding.</text><rect x="28" y="330" width="664" height="50" rx="12" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="361" font-size="17" font-weight="800" fill="#A3402F" text-anchor="middle">If either is missing, do not book the session.</text>
</svg>
