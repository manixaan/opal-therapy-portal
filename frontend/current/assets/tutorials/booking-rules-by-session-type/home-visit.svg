<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A home visit is a location: book the session type that matches the work, then record the location</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">A home visit is a location</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">It describes where a session happens, not what it is</text><rect x="28" y="104" width="360" height="222" rx="18" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="58" cy="136" r="15" fill="#23395B"/><text x="58" y="142" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="84" y="142" font-size="17" font-weight="800" fill="#23395B" text-anchor="start">Session type: the work you do</text><rect x="56" y="166" width="304" height="38" rx="19.0" fill="#23395B" stroke="#23395B" stroke-width="0"/><text x="208.0" y="191.33333333333334" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Initial assessment</text><rect x="56" y="216" width="304" height="38" rx="19.0" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="208.0" y="241.33333333333334" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Assessment session</text><rect x="56" y="266" width="304" height="38" rx="19.0" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="208.0" y="291.3333333333333" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Therapy session</text><path d="M398 215 H428" stroke="#0D5E57" stroke-width="4" stroke-linecap="round"/><path d="M413 200 V230" stroke="#0D5E57" stroke-width="4" stroke-linecap="round"/><rect x="438" y="104" width="254" height="222" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="2.5"/><circle cx="468" cy="136" r="15" fill="#E3A03A"/><text x="468" y="142" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="494" y="142" font-size="17" font-weight="800" fill="#8A5A12" text-anchor="start">Location</text><path d="M521 196 L565 158 L609 196 Z" fill="#E3A03A"/><rect x="531" y="196" width="68" height="50" fill="#FDF1DC" stroke="#E3A03A" stroke-width="3"/><rect x="555" y="216" width="20" height="30" fill="#E3A03A"/><text x="565" y="282" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">For example, the</text><text x="565" y="302" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">client’s home</text><rect x="28" y="340" width="664" height="44" rx="12" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="360" y="368" font-size="16" font-weight="700" fill="#8A5A12" text-anchor="middle">Book the session type that matches the work. Then record the location.</text>
</svg>
