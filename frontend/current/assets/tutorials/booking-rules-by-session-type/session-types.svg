<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The six session types: initial assessment, assessment session, therapy session, telehealth session, case management time and report writing</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Opal’s six session types</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Know them before you book anything</text><rect x="28" y="100" width="326" height="78" rx="16" fill="#fff" stroke="#23395B" stroke-width="2.5"/><circle cx="62" cy="139" r="17" fill="#23395B"/><text x="62" y="145" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="92" y="134" font-size="18" font-weight="800" fill="#23395B" text-anchor="start">Initial assessment</text><text x="92" y="158" font-size="14" font-weight="500" fill="#6B7C80" text-anchor="start">The first session with a new client</text><rect x="366" y="100" width="326" height="78" rx="16" fill="#fff" stroke="#14988A" stroke-width="2.5"/><circle cx="400" cy="139" r="17" fill="#14988A"/><text x="400" y="145" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="430" y="134" font-size="18" font-weight="800" fill="#14988A" text-anchor="start">Assessment session</text><text x="430" y="158" font-size="14" font-weight="500" fill="#6B7C80" text-anchor="start">Trials, equipment trials and FCAs</text><rect x="28" y="190" width="326" height="78" rx="16" fill="#fff" stroke="#6C63C9" stroke-width="2.5"/><circle cx="62" cy="229" r="17" fill="#6C63C9"/><text x="62" y="235" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="92" y="224" font-size="18" font-weight="800" fill="#6C63C9" text-anchor="start">Therapy session</text><text x="92" y="248" font-size="14" font-weight="500" fill="#6B7C80" text-anchor="start">Ongoing therapy</text><rect x="366" y="190" width="326" height="78" rx="16" fill="#fff" stroke="#E3A03A" stroke-width="2.5"/><circle cx="400" cy="229" r="17" fill="#E3A03A"/><text x="400" y="235" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="430" y="224" font-size="18" font-weight="800" fill="#8A5A12" text-anchor="start">Telehealth session</text><text x="430" y="248" font-size="14" font-weight="500" fill="#6B7C80" text-anchor="start">Delivered by video or phone</text><rect x="28" y="280" width="326" height="78" rx="16" fill="#fff" stroke="#0D5E57" stroke-width="2.5"/><circle cx="62" cy="319" r="17" fill="#0D5E57"/><text x="62" y="325" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="92" y="314" font-size="18" font-weight="800" fill="#0D5E57" text-anchor="start">Case management time</text><text x="92" y="338" font-size="14" font-weight="500" fill="#6B7C80" text-anchor="start">Managing the client’s case</text><rect x="366" y="280" width="326" height="78" rx="16" fill="#fff" stroke="#D9614E" stroke-width="2.5"/><circle cx="400" cy="319" r="17" fill="#D9614E"/><text x="400" y="325" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="430" y="314" font-size="18" font-weight="800" fill="#D9614E" text-anchor="start">Report writing</text><text x="430" y="338" font-size="14" font-weight="500" fill="#6B7C80" text-anchor="start">Time spent writing reports</text><text x="360" y="384" font-size="16" font-weight="700" fill="#6B7C80" text-anchor="middle">A home visit is a location, not a session type.</text>
</svg>
