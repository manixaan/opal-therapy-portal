<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">When a second therapist attends a session, the client is charged for one therapist only</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Two therapists at one session</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">The client is charged for one therapist only</text><rect x="28" y="104" width="664" height="210" rx="18" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><text x="360" y="138" font-size="17" font-weight="800" fill="#6B7C80" text-anchor="middle">One session</text><circle cx="220" cy="179.7" r="18.4" fill="#14988A"/><path d="M185.5 239.5 C 185.5 202.7, 254.5 202.7, 254.5 239.5 Z" fill="#14988A"/><rect x="145" y="260" width="150" height="34" rx="17.0" fill="#0D5E57" stroke="#0D5E57" stroke-width="0"/><text x="220.0" y="283.3333333333333" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Charged</text><circle cx="500" cy="179.7" r="18.4" fill="#9AA8AB"/><path d="M465.5 239.5 C 465.5 202.7, 534.5 202.7, 534.5 239.5 Z" fill="#9AA8AB"/><rect x="425" y="260" width="150" height="34" rx="17.0" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><text x="500.0" y="283.3333333333333" font-size="16" font-weight="700" fill="#4F5F63" text-anchor="middle">Not charged</text><rect x="28" y="330" width="664" height="50" rx="12" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="361" font-size="16" font-weight="700" fill="#A3402F" text-anchor="middle">Do not charge for the second therapist’s attendance.</text>
</svg>
