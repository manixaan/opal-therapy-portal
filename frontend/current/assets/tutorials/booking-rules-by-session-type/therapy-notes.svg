<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Face-to-face therapy is usually 50 minutes, then 10 to 15 minutes of case notes, written straight after or later the same day</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Therapy sessions and case notes</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Face-to-face therapy, then documentation</text><rect x="28" y="106" width="470" height="64" rx="14" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="263" y="136" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Therapy session</text><text x="263" y="158" font-size="15" font-weight="600" fill="#E3F4F1" text-anchor="middle">usually 50 minutes</text><rect x="506" y="106" width="186" height="64" rx="14" fill="#FDF1DC" stroke="#E3A03A" stroke-width="2.5"/><text x="599" y="136" font-size="18" font-weight="800" fill="#8A5A12" text-anchor="middle">Case notes</text><text x="599" y="158" font-size="15" font-weight="600" fill="#8A5A12" text-anchor="middle">10 to 15 minutes</text><text x="28" y="214" font-size="18" font-weight="800" fill="#1E2B2F" text-anchor="start">When do you write the case notes?</text><rect x="28" y="232" width="212" height="62" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><circle cx="58" cy="263" r="13" fill="#14988A"/><path d="M51 263 L56 268 L65 258" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="269" font-size="15" font-weight="700" fill="#0D5E57" text-anchor="start">Straight after</text><rect x="254" y="232" width="212" height="62" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><circle cx="284" cy="263" r="13" fill="#14988A"/><path d="M277 263 L282 268 L291 258" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="306" y="269" font-size="15" font-weight="700" fill="#0D5E57" text-anchor="start">Later the same day</text><rect x="480" y="232" width="212" height="62" rx="14" fill="#fff" stroke="#D9614E" stroke-width="2.5"/><circle cx="510" cy="263" r="13" fill="#D9614E"/><path d="M505 258 L515 268 M515 258 L505 268" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="532" y="269" font-size="15" font-weight="700" fill="#A3402F" text-anchor="start">On another day</text><rect x="28" y="320" width="664" height="54" rx="12" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="360" y="353" font-size="16" font-weight="700" fill="#0D5E57" text-anchor="middle">You book a block for the therapy session itself.</text>
</svg>
