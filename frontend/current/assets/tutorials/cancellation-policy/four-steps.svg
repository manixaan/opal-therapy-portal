<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Four steps: fill the time, talk to your supervisor, consider the reason, check reminder and travel; then discuss with your supervisor before deciding whether to charge</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">The four steps</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">A client cancels with less than 48 hours' notice</text><rect x="28" y="100" width="150" height="200" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><circle cx="103" cy="136" r="20" fill="#14988A"/><text x="103" y="143" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="103" y="184" font-size="16" font-weight="800" fill="#14988A" text-anchor="middle">Fill the time</text><text x="103" y="214" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">Try other work</text><text x="103" y="232" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">first, every time.</text><path d="M183 190 L193 200 L183 210" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="198" y="100" width="150" height="200" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><circle cx="273" cy="136" r="20" fill="#23395B"/><text x="273" y="143" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="273" y="184" font-size="16" font-weight="800" fill="#23395B" text-anchor="middle">Talk to your</text><text x="273" y="204" font-size="16" font-weight="800" fill="#23395B" text-anchor="middle">supervisor</text><text x="273" y="234" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">If you cannot fill it,</text><text x="273" y="252" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">discuss your weekly</text><text x="273" y="270" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">billable hours</text><path d="M353 190 L363 200 L353 210" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="368" y="100" width="150" height="200" rx="18" fill="#fff" stroke="#6C63C9" stroke-width="3"/><circle cx="443" cy="136" r="20" fill="#6C63C9"/><text x="443" y="143" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="443" y="184" font-size="16" font-weight="800" fill="#6C63C9" text-anchor="middle">Consider the</text><text x="443" y="204" font-size="16" font-weight="800" fill="#6C63C9" text-anchor="middle">reason</text><text x="443" y="234" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">Was it beyond the</text><text x="443" y="252" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">client's control?</text><path d="M523 190 L533 200 L523 210" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="538" y="100" width="150" height="200" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="3"/><circle cx="613" cy="136" r="20" fill="#E3A03A"/><text x="613" y="143" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="613" y="184" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">Check reminder</text><text x="613" y="204" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">and travel</text><text x="613" y="234" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">Reminder sent?</text><text x="613" y="252" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="middle">Travel started?</text><rect x="28" y="326" width="664" height="46" rx="12" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="355.3333333333333" font-size="16" font-weight="800" fill="#A3402F" text-anchor="middle">Discuss with your supervisor before deciding whether to charge.</text>
</svg>
