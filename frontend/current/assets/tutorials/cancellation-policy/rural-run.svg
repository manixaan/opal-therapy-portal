<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">On a rural and remote run, one short-notice cancellation can affect the whole run of visits</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">One cancellation, a whole run</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Rural and remote visits</text><path d="M80 250 L220 180 L370 240 L510 170 L630 240" fill="none" stroke="#14988A" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/><circle cx="80" cy="250" r="30" fill="#23395B"/><text x="80" y="256" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Base</text><rect x="168" y="156" width="104" height="48" rx="14" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="220" y="186" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">Visit 1</text><rect x="318" y="216" width="104" height="48" rx="14" fill="#FBE7E3" stroke="#D9614E" stroke-width="3"/><text x="370" y="246" font-size="15" font-weight="800" fill="#A3402F" text-anchor="middle">Visit 2</text><rect x="458" y="146" width="104" height="48" rx="14" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="510" y="176" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">Visit 3</text><rect x="578" y="216" width="104" height="48" rx="14" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="630" y="246" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">Visit 4</text><circle cx="370" cy="206" r="14" fill="#D9614E"/><path d="M365 201 L375 211 M375 201 L365 211" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="370" y="292" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">Cancelled at</text><text x="370" y="310" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">short notice</text><rect x="28" y="334" width="664" height="46" rx="12" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="360" y="363.3333333333333" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">You may lose billable time and travel that cannot be recovered.</text>
</svg>
