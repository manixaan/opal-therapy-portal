<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">What decides the charge: travel started, reminder sent and no response means full blocked time plus travel time; travel not started means session time but not travel time; other clients' travel affected means raise it with your supervisor</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">What decides the charge</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Two facts: the reminder, and whether travel had started</text><rect x="28" y="100" width="402" height="66" rx="14" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><rect x="28" y="100" width="8" height="66" rx="4" fill="#14988A"/><text x="50" y="129" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Travel had started, a reminder was sent</text><text x="50" y="150" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">and the client did not respond</text><path d="M438 133 H468" stroke="#14988A" stroke-width="5" stroke-linecap="round"/><path d="M462 122 L476 133 L462 144" fill="none" stroke="#14988A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="484" y="100" width="208" height="66" rx="14" fill="#E3F4F1" stroke="#14988A" stroke-width="2.5"/><text x="588" y="129" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">Full blocked time</text><text x="588" y="150" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">plus travel time</text><rect x="28" y="182" width="402" height="66" rx="14" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><rect x="28" y="182" width="8" height="66" rx="4" fill="#E3A03A"/><text x="50" y="221" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Travel had not started</text><path d="M438 215 H468" stroke="#E3A03A" stroke-width="5" stroke-linecap="round"/><path d="M462 204 L476 215 L462 226" fill="none" stroke="#E3A03A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="484" y="182" width="208" height="66" rx="14" fill="#FDF1DC" stroke="#E3A03A" stroke-width="2.5"/><text x="588" y="211" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle">Session time,</text><text x="588" y="232" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle">not travel time</text><rect x="28" y="264" width="402" height="66" rx="14" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><rect x="28" y="264" width="8" height="66" rx="4" fill="#6C63C9"/><text x="50" y="303" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Other clients' travel is affected</text><path d="M438 297 H468" stroke="#6C63C9" stroke-width="5" stroke-linecap="round"/><path d="M462 286 L476 297 L462 308" fill="none" stroke="#6C63C9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="484" y="264" width="208" height="66" rx="14" fill="#ECEAF8" stroke="#6C63C9" stroke-width="2.5"/><text x="588" y="293" font-size="15" font-weight="800" fill="#6C63C9" text-anchor="middle">Raise it with</text><text x="588" y="314" font-size="15" font-weight="800" fill="#6C63C9" text-anchor="middle">your supervisor</text><rect x="28" y="350" width="664" height="40" rx="12" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><text x="360" y="376.0" font-size="15" font-weight="800" fill="#1E2B2F" text-anchor="middle">Clients bunched in a similar location: the same rules apply.</text>
</svg>
