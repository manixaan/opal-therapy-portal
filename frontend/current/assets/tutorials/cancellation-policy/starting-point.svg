<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A cancellation with less than 48 hours' notice can be charged under the service agreement; this is a starting point only</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">The 48-hour starting point</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">How much notice did the client give?</text><rect x="40" y="150" width="380" height="22" rx="11" fill="#E3F4F1"/><rect x="410" y="150" width="230" height="22" fill="#E3A03A"/><rect x="600" y="150" width="40" height="22" rx="0" fill="#E3A03A"/><path d="M410 128 V196" stroke="#1E2B2F" stroke-width="3" stroke-dasharray="5 4"/><text x="410" y="120" font-size="15" font-weight="800" fill="#1E2B2F" text-anchor="middle">48 hours before</text><text x="225" y="200" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">48 hours or more</text><circle cx="652" cy="161" r="22" fill="#23395B"/><text x="652" y="120" font-size="15" font-weight="800" fill="#23395B" text-anchor="middle">Session</text><path d="M643 161 h18 M652 152 v18" stroke="#fff" stroke-width="0"/><circle cx="652" cy="161" r="7" fill="#fff"/><path d="M536 176 V210" stroke="#E3A03A" stroke-width="3"/><rect x="300" y="214" width="392" height="96" rx="16" fill="#FDF1DC" stroke="#E3A03A" stroke-width="2.5"/><text x="322" y="244" font-size="17" font-weight="800" fill="#8A5A12" text-anchor="start">Less than 48 hours' notice</text><text x="322" y="270" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">can be charged under the service agreement.</text><text x="322" y="292" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="start">This is a starting point only.</text><rect x="28" y="334" width="664" height="46" rx="12" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="360" y="363.0" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">Fill the time, check the circumstances, talk to your supervisor.</text>
</svg>
