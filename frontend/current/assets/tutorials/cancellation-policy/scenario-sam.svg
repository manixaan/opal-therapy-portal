<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Scenario with a made-up client, Sam: a reminder was sent, Sam did not reply, you were on the road, and Sam cancelled 20 hours before the session</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Scenario: travel already started</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Sam is a made-up client</text><rect x="28" y="104" width="156" height="76" rx="16" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="106" y="138" font-size="16" font-weight="800" fill="#14988A" text-anchor="middle">Reminder</text><text x="106" y="160" font-size="16" font-weight="800" fill="#14988A" text-anchor="middle">sent</text><path d="M188 132 L198 142 L188 152" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="104" width="156" height="76" rx="16" fill="#fff" stroke="#E3A03A" stroke-width="3"/><text x="278" y="138" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">No reply</text><text x="278" y="160" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">from Sam</text><path d="M360 132 L370 142 L360 152" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="372" y="104" width="156" height="76" rx="16" fill="#fff" stroke="#23395B" stroke-width="3"/><text x="450" y="138" font-size="16" font-weight="800" fill="#23395B" text-anchor="middle">You are on</text><text x="450" y="160" font-size="16" font-weight="800" fill="#23395B" text-anchor="middle">the road</text><path d="M532 132 L542 142 L532 152" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="544" y="96" width="148" height="92" rx="16" fill="#FBE7E3" stroke="#D9614E" stroke-width="3"/><text x="618" y="132" font-size="16" font-weight="800" fill="#A3402F" text-anchor="middle">Sam cancels</text><text x="618" y="156" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">20 hours before</text><text x="618" y="174" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">the session</text><rect x="28" y="214" width="664" height="166" rx="18" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><text x="52" y="252" font-size="20" font-weight="800" fill="#1E2B2F" text-anchor="start">What do you do first?</text><text x="52" y="284" font-size="16" font-weight="600" fill="#6B7C80" text-anchor="start">Weigh the facts above, then decide on the next screens:</text><rect x="52" y="312" width="196" height="40" rx="20.0" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="150.0" y="338.0" font-size="15" font-weight="700" fill="#0D5E57" text-anchor="middle">Can the time be filled?</text><rect x="264" y="312" width="196" height="40" rx="20.0" fill="#E6EAF1" stroke="#E6EAF1" stroke-width="0"/><text x="362.0" y="338.0" font-size="15" font-weight="700" fill="#23395B" text-anchor="middle">Who do you talk to?</text><rect x="476" y="312" width="196" height="40" rx="20.0" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="574.0" y="338.0" font-size="15" font-weight="700" fill="#8A5A12" text-anchor="middle">What can be charged?</text>
</svg>
