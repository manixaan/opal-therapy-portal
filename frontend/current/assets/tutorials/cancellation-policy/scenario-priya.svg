<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Scenario with made-up clients: Priya cancels the evening before and you have not left; Tom lives nearby and is booked after Priya</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Scenario: travel not started</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Priya and Tom are made-up clients</text><rect x="28" y="120" width="170" height="100" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><text x="113" y="162" font-size="18" font-weight="800" fill="#23395B" text-anchor="middle">You</text><text x="113" y="188" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">have not left yet</text><path d="M202 170 H300" stroke="#E2DDD3" stroke-width="4" stroke-dasharray="8 6"/><rect x="304" y="120" width="170" height="100" rx="18" fill="#FBE7E3" stroke="#D9614E" stroke-width="3"/><text x="389" y="158" font-size="18" font-weight="800" fill="#A3402F" text-anchor="middle">Priya</text><text x="389" y="182" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">cancels the</text><text x="389" y="200" font-size="14" font-weight="700" fill="#A3402F" text-anchor="middle">evening before</text><circle cx="466" cy="124" r="14" fill="#D9614E"/><path d="M461 119 L471 129 M471 119 L461 129" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M478 170 H516" stroke="#E2DDD3" stroke-width="4" stroke-dasharray="8 6"/><rect x="520" y="120" width="172" height="100" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="606" y="158" font-size="18" font-weight="800" fill="#0D5E57" text-anchor="middle">Tom</text><text x="606" y="182" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">lives nearby,</text><text x="606" y="200" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">booked after Priya</text><rect x="28" y="246" width="664" height="134" rx="18" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><text x="52" y="284" font-size="20" font-weight="800" fill="#1E2B2F" text-anchor="start">What do you do?</text><text x="52" y="314" font-size="16" font-weight="600" fill="#6B7C80" text-anchor="start">Weigh the facts above, then decide on the next screens:</text><rect x="52" y="332" width="196" height="34" rx="17.0" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="150.0" y="354.6666666666667" font-size="14" font-weight="700" fill="#0D5E57" text-anchor="middle">Can the time be filled?</text><rect x="264" y="332" width="196" height="34" rx="17.0" fill="#ECEAF8" stroke="#ECEAF8" stroke-width="0"/><text x="362.0" y="354.6666666666667" font-size="14" font-weight="700" fill="#6C63C9" text-anchor="middle">Tom's travel affected?</text><rect x="476" y="332" width="196" height="34" rx="17.0" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="574.0" y="354.6666666666667" font-size="14" font-weight="700" fill="#8A5A12" text-anchor="middle">What can be charged?</text>
</svg>
