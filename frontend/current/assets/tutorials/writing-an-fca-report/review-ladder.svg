<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Your first FCA reports are each reviewed by your clinical supervisor; you submit on your own once your supervisor is confident</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Supervisor review</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Your first few reports are reviewed before they are sent</text><rect x="28" y="110" width="196" height="140" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><text x="126" y="164" font-size="19" font-weight="800" fill="#23395B" text-anchor="middle">First reports</text><text x="126" y="194" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">written by you</text><path d="M230 180 H250" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M244 169 L258 180 L244 191" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="110" width="196" height="140" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="360" y="164" font-size="19" font-weight="800" fill="#0D5E57" text-anchor="middle">Reviewed</text><text x="360" y="194" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">each one, by your</text><text x="360" y="214" font-size="15" font-weight="600" fill="#6B7C80" text-anchor="middle">clinical supervisor</text><path d="M464 180 H484" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M478 169 L492 180 L478 191" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="110" width="196" height="140" rx="18" fill="#0D5E57" stroke="#0D5E57" stroke-width="3"/><text x="594" y="164" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">On your own</text><text x="594" y="194" font-size="15" font-weight="600" fill="#CFE9E5" text-anchor="middle">once your supervisor</text><text x="594" y="214" font-size="15" font-weight="600" fill="#CFE9E5" text-anchor="middle">is confident</text><rect x="28" y="290" width="664" height="82" rx="16" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="360" y="324" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="middle">Your supervisor decides when.</text><text x="360" y="352" font-size="15" font-weight="600" fill="#8A5A12" text-anchor="middle">Until then, don't send a report without your supervisor's review.</text>
</svg>
