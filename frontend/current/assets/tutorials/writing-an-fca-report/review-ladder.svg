<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Early FCA reports are each reviewed by the clinical supervisor; independent submission follows once the supervisor is confident, likely after about five</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Supervisor review</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Your first few reports are reviewed before they are sent</text><rect x="40" y="128" width="76" height="96" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="78" y="166" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="middle">#1</text><text x="78" y="196" font-size="13" font-weight="700" fill="#6B7C80" text-anchor="middle">reviewed</text><rect x="132" y="128" width="76" height="96" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="170" y="166" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="middle">#2</text><text x="170" y="196" font-size="13" font-weight="700" fill="#6B7C80" text-anchor="middle">reviewed</text><rect x="224" y="128" width="76" height="96" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="262" y="166" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="middle">#3</text><text x="262" y="196" font-size="13" font-weight="700" fill="#6B7C80" text-anchor="middle">reviewed</text><rect x="316" y="128" width="76" height="96" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="354" y="166" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="middle">#4</text><text x="354" y="196" font-size="13" font-weight="700" fill="#6B7C80" text-anchor="middle">reviewed</text><rect x="408" y="128" width="76" height="96" rx="14" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="446" y="166" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="middle">#5</text><text x="446" y="196" font-size="13" font-weight="700" fill="#6B7C80" text-anchor="middle">reviewed</text><path d="M510 176 H540" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M534 165 L548 176 L534 187" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="556" y="112" width="136" height="128" rx="18" fill="#0D5E57" stroke="#0D5E57" stroke-width="0"/><text x="624" y="168" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">On your</text><text x="624" y="192" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">own</text><text x="276" y="258" font-size="15" font-weight="700" fill="#6B7C80" text-anchor="middle">likely after about five reports have gone well</text><rect x="28" y="290" width="664" height="82" rx="16" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="360" y="324" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="middle">Your supervisor decides when.</text><text x="360" y="352" font-size="15" font-weight="600" fill="#8A5A12" text-anchor="middle">Until then, don't send a report without your supervisor's review.</text>
</svg>
