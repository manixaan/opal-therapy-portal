<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A vague, unsourced statement next to a sourced report built from named sources, functional observations and day-to-day detail</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Paint a picture of daily life</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">The planner will most likely never meet the participant</text><rect x="28" y="102" width="318" height="270" rx="18" fill="#fff" stroke="#D9614E" stroke-width="2.5"/><circle cx="60" cy="136" r="13" fill="#D9614E"/><path d="M55 131 L65 141 M65 131 L55 141" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="84" y="143" font-size="20" font-weight="800" fill="#A3402F" text-anchor="start">Vague, general</text><rect x="48" y="168" width="278" height="58" rx="12" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="66" y="203" font-size="17" font-weight="600" fill="#A3402F" text-anchor="start">“Struggles with daily tasks.”</text><text x="48" y="262" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="start">No source. No observation. The</text><text x="48" y="283" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="start">planner cannot picture this</text><text x="48" y="304" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="start">person.</text><rect x="374" y="102" width="318" height="270" rx="18" fill="#fff" stroke="#14988A" stroke-width="2.5"/><circle cx="406" cy="136" r="14" fill="#14988A"/><path d="M399 136 L404 141 L413 131" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="143" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="start">Sourced and functional</text><rect x="394" y="168" width="230" height="34" rx="17.0" fill="#23395B" stroke="#23395B" stroke-width="0"/><text x="509.0" y="191.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Named source</text><rect x="394" y="214" width="230" height="34" rx="17.0" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="509.0" y="237.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Functional observation</text><rect x="394" y="260" width="230" height="34" rx="17.0" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="509.0" y="283.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Day-to-day detail</text><text x="394" y="324" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">The planner finishes reading and</text><text x="394" y="344" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">understands how this person</text><text x="394" y="364" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">presents.</text>
</svg>
