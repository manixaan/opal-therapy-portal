<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Six mistakes to avoid in an FCA report</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Mistakes to avoid</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Keep the report concise and to the point</text><rect x="28" y="100" width="322" height="76" rx="16" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="62" cy="138" r="15" fill="#D9614E"/><path d="M57 133 L67 143 M67 133 L57 143" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="90" y="144" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">Inconsistent information</text><rect x="370" y="100" width="322" height="76" rx="16" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="404" cy="138" r="15" fill="#D9614E"/><path d="M399 133 L409 143 M409 133 L399 143" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="432" y="144" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">Repeating information</text><rect x="28" y="192" width="322" height="76" rx="16" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="62" cy="230" r="15" fill="#D9614E"/><path d="M57 225 L67 235 M67 225 L57 235" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="90" y="236" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">No link to the disability</text><rect x="370" y="192" width="322" height="76" rx="16" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="404" cy="230" r="15" fill="#D9614E"/><path d="M399 225 L409 235 M409 225 L399 235" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="432" y="225" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">Assessment never</text><text x="432" y="246" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">referred back to</text><rect x="28" y="284" width="322" height="76" rx="16" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="62" cy="322" r="15" fill="#D9614E"/><path d="M57 317 L67 327 M67 317 L57 327" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="90" y="328" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">Not naming the source</text><rect x="370" y="284" width="322" height="76" rx="16" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><circle cx="404" cy="322" r="15" fill="#D9614E"/><path d="M399 317 L409 327 M409 317 L399 327" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="432" y="328" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="start">Inventing or exaggerating</text>
</svg>
