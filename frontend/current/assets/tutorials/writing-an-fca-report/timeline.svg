<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Send FCA reports within about 4 to 8 weeks of the assessment starting, honour deadlines, and allow about 5 to 10 hours to write</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Timing guidelines</text><text x="28" y="112" font-size="16" font-weight="700" fill="#6B7C80" text-anchor="start">Send within</text><rect x="28" y="124" width="664" height="22" rx="11" fill="#E6EBF3" stroke="#E6EBF3" stroke-width="0"/><rect x="300" y="118" width="300" height="34" rx="17" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="450" y="141" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4 → 8 weeks from the start</text><text x="28" y="176" font-size="13" font-weight="600" fill="#6B7C80" text-anchor="start">start of assessment</text><path d="M640 98 V170" stroke="#D9614E" stroke-width="4"/><path d="M640 100 H672 L664 113 L672 126 H640 Z" fill="#D9614E"/><text x="690" y="192" font-size="13" font-weight="700" fill="#A3402F" text-anchor="end">If there is a deadline, meet it</text><rect x="28" y="222" width="320" height="150" rx="18" fill="#fff" stroke="#23395B" stroke-width="2.5"/><text x="52" y="262" font-size="22" font-weight="800" fill="#23395B" text-anchor="start">About 5–10 hours</text><text x="52" y="292" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">to write, more if the case is</text><text x="52" y="312" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">complex. Allow longer at first;</text><text x="52" y="332" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">your supervisor will help you</text><text x="52" y="352" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">plan the hours.</text><rect x="372" y="222" width="320" height="150" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="2.5"/><text x="396" y="262" font-size="20" font-weight="800" fill="#8A5A12" text-anchor="start">Why this matters</text><text x="396" y="292" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">It prevents reports building up.</text><text x="396" y="312" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">Timing depends on access to the</text><text x="396" y="332" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">client and how quickly</text><text x="396" y="352" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">assessments are completed.</text>
</svg>
