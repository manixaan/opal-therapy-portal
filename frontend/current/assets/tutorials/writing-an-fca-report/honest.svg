<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Say when a participant is independent, then show remaining needs; never invent or exaggerate</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Honest reporting</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">An accurate report is more credible than an overstated one</text><rect x="28" y="102" width="664" height="120" rx="18" fill="#fff" stroke="#14988A" stroke-width="2.5"/><rect x="48" y="120" width="230" height="36" rx="18.0" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="163.0" y="144.33333333333334" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">If independent, say so</text><text x="48" y="184" font-size="17" font-weight="600" fill="#1E2B2F" text-anchor="start">Then highlight the weaknesses and support needs</text><text x="48" y="207" font-size="17" font-weight="600" fill="#1E2B2F" text-anchor="start">that remain in that domain.</text><rect x="28" y="240" width="664" height="136" rx="18" fill="#fff" stroke="#D9614E" stroke-width="2.5"/><circle cx="60" cy="274" r="13" fill="#D9614E"/><path d="M55 269 L65 279 M65 269 L55 279" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="86" y="281" font-size="20" font-weight="800" fill="#A3402F" text-anchor="start">Never</text><rect x="48" y="300" width="190" height="34" rx="17.0" fill="#D9614E" stroke="#D9614E" stroke-width="0"/><text x="143.0" y="323.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">invent information</text><rect x="252" y="300" width="210" height="34" rx="17.0" fill="#D9614E" stroke="#D9614E" stroke-width="0"/><text x="357.0" y="323.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">exaggerate difficulties</text><text x="48" y="360" font-size="16" font-weight="600" fill="#6B7C80" text-anchor="start">Do not overstate difficulties to strengthen the case.</text>
</svg>
