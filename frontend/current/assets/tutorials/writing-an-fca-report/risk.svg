<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Writing the risk of no support: realistic, evidence-based, a potential outcome; never the invented worst case</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">The risk of no support</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Could happen — not will happen</text><rect x="28" y="100" width="300" height="270" rx="18" fill="#fff" stroke="#14988A" stroke-width="2.5"/><circle cx="60" cy="134" r="14" fill="#14988A"/><path d="M53 134 L58 139 L67 129" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="141" font-size="20" font-weight="800" fill="#0D5E57" text-anchor="start">Do</text><text x="48" y="188" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Base it on your evidence</text><text x="48" y="232" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Make it realistic for this person</text><text x="48" y="276" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Say it is a potential outcome</text><text x="48" y="320" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Unsure? Ask your supervisor</text><rect x="352" y="100" width="340" height="270" rx="18" fill="#fff" stroke="#D9614E" stroke-width="2.5"/><circle cx="384" cy="134" r="13" fill="#D9614E"/><path d="M379 129 L389 139 M389 129 L379 139" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><text x="408" y="141" font-size="20" font-weight="800" fill="#A3402F" text-anchor="start">Don't</text><text x="372" y="188" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Paint the worst case</text><text x="372" y="232" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Add outcomes not in the evidence</text><text x="372" y="276" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Overstate to strengthen the case</text><text x="372" y="320" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="start">• Make anything up</text>
</svg>
