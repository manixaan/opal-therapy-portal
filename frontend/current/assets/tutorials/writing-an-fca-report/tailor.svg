<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Focus differs by disability: a physical disability centres mobility and ADLs; a cognitive or intellectual disability may not affect mobility</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Tailor the report to the disability</text><rect x="24" y="76" width="324" height="310" rx="18" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="44" y="110" font-size="19" font-weight="800" fill="#14988A" text-anchor="start">Physical disability</text><text x="44" y="148" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Mobility</text><rect x="196" y="134" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="196" y="134" width="132" height="18" rx="9" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="44" y="188" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Self-care ADL</text><rect x="196" y="174" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="196" y="174" width="125.39999999999999" height="18" rx="9" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="44" y="228" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Domestic ADL</text><rect x="196" y="214" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="196" y="214" width="118.8" height="18" rx="9" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="44" y="268" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Cognition</text><rect x="196" y="254" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="196" y="254" width="19.8" height="18" rx="9" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="44" y="308" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Communication</text><rect x="196" y="294" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="196" y="294" width="19.8" height="18" rx="9" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="44" y="346" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="start">Cognition: still state any impact.</text><rect x="372" y="76" width="324" height="310" rx="18" fill="#fff" stroke="#6C63C9" stroke-width="2.5"/><text x="392" y="110" font-size="19" font-weight="800" fill="#6C63C9" text-anchor="start">Cognitive / intellectual</text><text x="392" y="148" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Cognition</text><rect x="544" y="134" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="544" y="134" width="132" height="18" rx="9" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="392" y="188" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Communication</text><rect x="544" y="174" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="544" y="174" width="92.39999999999999" height="18" rx="9" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="392" y="228" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Social interaction</text><rect x="544" y="214" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="544" y="214" width="92.39999999999999" height="18" rx="9" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="392" y="268" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Mobility</text><rect x="544" y="254" width="132" height="18" rx="9" fill="#EEF0EE" stroke="#EEF0EE" stroke-width="0"/><rect x="544" y="254" width="15.84" height="18" rx="9" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="392" y="346" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="start">Mobility may not be affected;</text><text x="392" y="366" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="start">do not spend long on it.</text>
</svg>
