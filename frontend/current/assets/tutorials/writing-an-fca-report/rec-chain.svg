<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Each recommended support links to the need, why it is reasonable and necessary, and the participant goal, plus the risk if not provided</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Link every recommendation</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">For each support, show all three</text><rect x="30" y="112" width="144" height="150" rx="18" fill="#23395B" stroke="#23395B" stroke-width="0"/><text x="102" y="180" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Support</text><text x="102" y="206" font-size="15" font-weight="500" fill="#D7E2EE" text-anchor="middle">recommended</text><path d="M178 187 H188" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M182 176 L196 187 L182 198" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="112" width="144" height="150" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="3"/><text x="272" y="180" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="middle">The need</text><text x="272" y="206" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">it responds to</text><path d="M346 187 H356" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M350 176 L364 187 L350 198" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="368" y="112" width="144" height="150" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="440" y="180" font-size="19" font-weight="800" fill="#14988A" text-anchor="middle">Reasonable</text><text x="440" y="206" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">and necessary:</text><text x="440" y="225" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">explain why</text><path d="M514 187 H524" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M518 176 L532 187 L518 198" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="112" width="144" height="150" rx="18" fill="#fff" stroke="#6C63C9" stroke-width="3"/><text x="608" y="180" font-size="19" font-weight="800" fill="#6C63C9" text-anchor="middle">The goal</text><text x="608" y="206" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="middle">it relates to</text><rect x="28" y="296" width="664" height="76" rx="16" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="328" font-size="19" font-weight="800" fill="#A3402F" text-anchor="middle">+ the risk if it is not provided</text><text x="360" y="354" font-size="15" font-weight="600" fill="#A3402F" text-anchor="middle">what could realistically happen — a potential outcome</text>
</svg>
