<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Every booking records service type, face-to-face or non-face-to-face, billable or non-billable, and location; travel is then calculated</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Every booking records four things</text><rect x="24" y="86" width="154" height="150" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><circle cx="101" cy="126" r="20" fill="#23395B"/><text x="101" y="133" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="101" y="180" font-size="17" font-weight="800" fill="#23395B" text-anchor="middle">Service type</text><rect x="194" y="86" width="154" height="150" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><circle cx="271" cy="126" r="20" fill="#14988A"/><text x="271" y="133" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="271" y="180" font-size="15" font-weight="800" fill="#14988A" text-anchor="middle">Face-to-face or</text><text x="271" y="200" font-size="15" font-weight="800" fill="#14988A" text-anchor="middle">non-face-to-face</text><rect x="364" y="86" width="154" height="150" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="3"/><circle cx="441" cy="126" r="20" fill="#E3A03A"/><text x="441" y="133" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="441" y="180" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle">Billable or</text><text x="441" y="200" font-size="15" font-weight="800" fill="#8A5A12" text-anchor="middle">non-billable</text><rect x="534" y="86" width="154" height="150" rx="18" fill="#fff" stroke="#6C63C9" stroke-width="3"/><circle cx="611" cy="126" r="20" fill="#6C63C9"/><text x="611" y="133" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="611" y="180" font-size="17" font-weight="800" fill="#6C63C9" text-anchor="middle">Location</text><path d="M640 240 V262" stroke="#0D5E57" stroke-width="4"/><path d="M630 256 l10 10 l10 -10" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round"/><rect x="442" y="274" width="250" height="50" rx="14" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="567" y="305" font-size="16" font-weight="800" fill="#0D5E57" text-anchor="middle">Travel is calculated for you</text><rect x="24" y="340" width="672" height="44" rx="12" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="360" y="368" font-size="16" font-weight="700" fill="#8A5A12" text-anchor="middle">Unsure whether it is billable? Ask your Senior Supervisor.</text>
</svg>
