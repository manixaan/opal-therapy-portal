ke-dasharray="5 5"/><rect x="500" y="175" width="180" height="52" rx="26" fill="#fff" stroke="#6C63C9" stroke-width="3"/><text x="590" y="208" font-size="17" font-weight="800" fill="#6C63C9" text-anchor="middle">Your supervisor</text><path d="M496 201 L470 200" stroke="#6C63C9" stroke-width="3" stroke-dasharray="5 5"/><rect x="140" y="318" width="440" height="58" rx="14" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="343" font-size="16" font-weight="800" fill="#A3402F" text-anchor="middle">No other team members have access.</text><text x="360" y="365" font-size="14" font-weight="600" fill="#A3402F" text-anchor="middle">Only add the details a booking needs.</text>
