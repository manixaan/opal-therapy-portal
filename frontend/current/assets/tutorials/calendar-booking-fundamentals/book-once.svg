<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A booking made in the portal copies automatically to Splose and to your Outlook calendar</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Book once, in the portal</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Therapy, assessment and report writing</text><rect x="28" y="128" width="230" height="170" rx="20" fill="#23395B" stroke="#23395B" stroke-width="0"/><text x="143" y="196" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">Portal</text><text x="143" y="228" font-size="18" font-weight="600" fill="#D7E2EE" text-anchor="middle">booking</text><path d="M262 196 C 330 196 340 140 410 140" fill="none" stroke="#0D5E57" stroke-width="4"/><path d="M262 230 C 330 230 340 270 410 270" fill="none" stroke="#0D5E57" stroke-width="4"/><path d="M400 130 l12 10 l-12 10" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round"/><path d="M400 260 l12 10 l-12 10" fill="none" stroke="#0D5E57" stroke-width="4" stroke-linecap="round"/><text x="336" y="200" font-size="14" font-weight="700" fill="#0D5E57" text-anchor="middle">copies</text><text x="336" y="218" font-size="14" font-weight="700" fill="#0D5E57" text-anchor="middle">automatically</text><rect x="420" y="100" width="272" height="82" rx="16" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="442" y="134" font-size="21" font-weight="800" fill="#0D5E57" text-anchor="start">Splose</text><text x="442" y="160" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">where you write case notes</text><rect x="420" y="230" width="272" height="82" rx="16" fill="#fff" stroke="#E3A03A" stroke-width="2.5"/><text x="442" y="264" font-size="21" font-weight="800" fill="#8A5A12" text-anchor="start">Outlook calendar</text><text x="442" y="290" font-size="15" font-weight="500" fill="#6B7C80" text-anchor="start">your calendar, kept in step</text><text x="360" y="362" font-size="17" font-weight="700" fill="#1E2B2F" text-anchor="middle">No need to enter the booking again in either place.</text>
</svg>
