<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">After each booking the portal asks whether you are going to your next session, travelling home or to another location</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Answer the travel question every time</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">After each booking, where do you go next?</text><rect x="28" y="150" width="180" height="110" rx="18" fill="#23395B" stroke="#23395B" stroke-width="0"/><text x="118" y="200" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">This</text><text x="118" y="226" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">session</text><path d="M212 205 C 260 205 270 134 318 134" fill="none" stroke="#14988A" stroke-width="3.5"/><rect x="324" y="104" width="220" height="60" rx="16" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="434" y="141" font-size="19" font-weight="800" fill="#14988A" text-anchor="middle">Next session</text><path d="M212 205 C 260 205 270 210 318 210" fill="none" stroke="#E3A03A" stroke-width="3.5"/><rect x="324" y="180" width="220" height="60" rx="16" fill="#fff" stroke="#E3A03A" stroke-width="3"/><text x="434" y="217" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="middle">Travelling home</text><path d="M212 205 C 260 205 270 286 318 286" fill="none" stroke="#6C63C9" stroke-width="3.5"/><rect x="324" y="256" width="220" height="60" rx="16" fill="#fff" stroke="#6C63C9" stroke-width="3"/><text x="434" y="293" font-size="19" font-weight="800" fill="#6C63C9" text-anchor="middle">Another location</text><rect x="566" y="150" width="126" height="110" rx="18" fill="#E3F4F1" stroke="#E3F4F1" stroke-width="0"/><text x="629" y="196" font-size="17" font-weight="800" fill="#0D5E57" text-anchor="middle">Travel</text><text x="629" y="220" font-size="17" font-weight="800" fill="#0D5E57" text-anchor="middle">calculated</text><rect x="28" y="340" width="664" height="44" rx="12" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="368" font-size="17" font-weight="800" fill="#A3402F" text-anchor="middle">Travel is only correct if your answer is correct.</text>
