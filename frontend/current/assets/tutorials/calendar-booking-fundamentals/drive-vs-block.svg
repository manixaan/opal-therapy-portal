<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Short drives between sessions are absorbed in session time; flights and main driving time for longer trips are blocked out in the calendar</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Short drives and long trips</text><rect x="28" y="86" width="320" height="290" rx="18" fill="#fff" stroke="#14988A" stroke-width="2.5"/><text x="52" y="124" font-size="19" font-weight="800" fill="#0D5E57" text-anchor="start">Between sessions,</text><text x="52" y="148" font-size="19" font-weight="800" fill="#0D5E57" text-anchor="start">same area</text><rect x="52" y="176" width="272" height="40" rx="10" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="188" y="202" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Session</text><rect x="52" y="228" width="272" height="40" rx="10" fill="#CFE3DF" stroke="#CFE3DF" stroke-width="0"/><text x="188" y="254" font-size="15" font-weight="800" fill="#0D5E57" text-anchor="middle">a few minutes</text><rect x="52" y="280" width="272" height="40" rx="10" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="188" y="306" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Session</text><text x="52" y="350" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="start">Absorbed in session time. No</text><text x="52" y="368" font-size="14" font-weight="600" fill="#6B7C80" text-anchor="start">separate block.</text><rect x="372" y="86" width="320" height="290" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="2.5"/><text x="396" y="124" font-size="19" font-weight="800" fill="#8A5A12" text-anchor="start">Longer trips</text><rect x="396" y="160" width="272" height="48" rx="10" fill="#FDF1DC" stroke="#E3A03A" stroke-width="2" stroke-dasharray="7 5"/><text x="532" y="190" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">Flight</text><rect x="396" y="224" width="272" height="48" rx="10" fill="#FDF1DC" stroke="#E3A03A" stroke-width="2" stroke-dasharray="7 5"/><text x="532" y="254" font-size="16" font-weight="800" fill="#8A5A12" text-anchor="middle">Main driving time</text><text x="396" y="330" font-size="15" font-weight="700" fill="#1E2B2F" text-anchor="start">Blocked out in the calendar.</text>
</svg>
