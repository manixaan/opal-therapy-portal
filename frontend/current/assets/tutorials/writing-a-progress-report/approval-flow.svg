<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A draft goes to the family coordinator to review; only once approved is it sent to NDIS inquiries or the family, or they submit it</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Draft → approval → send</text><rect x="24" y="96" width="200" height="130" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><text x="124" y="150" font-size="22" font-weight="800" fill="#23395B" text-anchor="middle">Draft</text><text x="124" y="182" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">you write it</text><path d="M228 161 H248" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M242 150 L256 161 L242 172" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="96" width="200" height="130" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="3"/><text x="360" y="150" font-size="22" font-weight="800" fill="#8A5A12" text-anchor="middle">Coordinator</text><text x="360" y="182" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">reviews the draft</text><path d="M464 161 H484" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M478 150 L492 161 L478 172" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="96" width="200" height="130" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><text x="596" y="150" font-size="22" font-weight="800" fill="#14988A" text-anchor="middle">Approved</text><text x="596" y="182" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">only then is it sent</text><text x="360" y="270" font-size="18" font-weight="800" fill="#1E2B2F" text-anchor="middle">Sent to…</text><rect x="84" y="288" width="172" height="34" rx="17.0" fill="#E6EBF3" stroke="#E6EBF3" stroke-width="0"/><text x="170.0" y="311.0" font-size="15" font-weight="700" fill="#23395B" text-anchor="middle">NDIS inquiries</text><rect x="274" y="288" width="172" height="34" rx="17.0" fill="#E6EBF3" stroke="#E6EBF3" stroke-width="0"/><text x="360.0" y="311.0" font-size="15" font-weight="700" fill="#23395B" text-anchor="middle">the family</text><rect x="464" y="288" width="172" height="34" rx="17.0" fill="#E6EBF3" stroke="#E6EBF3" stroke-width="0"/><text x="550.0" y="311.0" font-size="15" font-weight="700" fill="#23395B" text-anchor="middle">or they submit it</text><rect x="84" y="338" width="552" height="44" rx="12" fill="#FDF1DC" stroke="#FDF1DC" stroke-width="0"/><text x="360" y="366" font-size="18" font-weight="800" fill="#8A5A12" text-anchor="middle">Always clarify who is sending the report.</text>
</svg>
