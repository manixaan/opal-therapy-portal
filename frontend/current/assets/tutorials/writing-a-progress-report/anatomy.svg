<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The three parts of a progress report: background, goal by goal, and recommendations</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Three parts, in this order</text><rect x="20" y="84" width="216" height="296" rx="18" fill="#fff" stroke="#23395B" stroke-width="2.5"/><path d="M20 102 a18 18 0 0 1 18 -18 h180 a18 18 0 0 1 18 18 v62 h-216 z" fill="#23395B"/><text x="128" y="112" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">PART 1</text><text x="128" y="136" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Background</text><rect x="42" y="180" width="170" height="10" rx="5" fill="#EEF0EE"/><rect x="42" y="202" width="150" height="10" rx="5" fill="#EEF0EE"/><rect x="42" y="224" width="120" height="10" rx="5" fill="#EEF0EE"/><text x="128" y="288" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">client, disability,</text><text x="128" y="312" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">length of service,</text><text x="128" y="336" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">hours used</text><path d="M242 232 l10 8 l-10 8 z" fill="#0D5E57"/><rect x="252" y="84" width="216" height="296" rx="18" fill="#fff" stroke="#14988A" stroke-width="2.5"/><path d="M252 102 a18 18 0 0 1 18 -18 h180 a18 18 0 0 1 18 18 v62 h-216 z" fill="#14988A"/><text x="360" y="112" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">PART 2</text><text x="360" y="136" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Goal by goal</text><rect x="274" y="180" width="170" height="10" rx="5" fill="#EEF0EE"/><rect x="274" y="202" width="150" height="10" rx="5" fill="#EEF0EE"/><rect x="274" y="224" width="120" height="10" rx="5" fill="#EEF0EE"/><text x="360" y="288" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">progress or barriers,</text><text x="360" y="312" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">linked to the</text><text x="360" y="336" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">therapy plan</text><path d="M474 232 l10 8 l-10 8 z" fill="#0D5E57"/><rect x="484" y="84" width="216" height="296" rx="18" fill="#fff" stroke="#6C63C9" stroke-width="2.5"/><path d="M484 102 a18 18 0 0 1 18 -18 h180 a18 18 0 0 1 18 18 v62 h-216 z" fill="#6C63C9"/><text x="592" y="112" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">PART 3</text><text x="592" y="136" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">Recommendations</text><rect x="506" y="180" width="170" height="10" rx="5" fill="#EEF0EE"/><rect x="506" y="202" width="150" height="10" rx="5" fill="#EEF0EE"/><rect x="506" y="224" width="120" height="10" rx="5" fill="#EEF0EE"/><text x="592" y="288" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">for the next plan,</text><text x="592" y="312" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">with evidence</text><text x="592" y="336" font-size="16" font-weight="600" fill="#1E2B2F" text-anchor="middle">where needed</text>
</svg>
