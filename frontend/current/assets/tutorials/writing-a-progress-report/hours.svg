<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A bar of hours used falls short of hours normally used; the gap is labelled cancellations and illness and must be explained</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Explain low hours</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Otherwise NDIS may assume the client does not need them</text><text x="28" y="140" font-size="18" font-weight="700" fill="#6B7C80" text-anchor="start">Hours normally used</text><rect x="28" y="152" width="664" height="40" rx="12" fill="#E6EBF3" stroke="#E6EBF3" stroke-width="0"/><text x="28" y="232" font-size="18" font-weight="700" fill="#6B7C80" text-anchor="start">Hours used this plan</text><rect x="28" y="244" width="664" height="40" rx="12" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><rect x="28" y="244" width="400" height="40" rx="12" fill="#14988A" stroke="#14988A" stroke-width="0"/><path d="M436 264 H684" stroke="#D9614E" stroke-width="3" stroke-dasharray="8 7"/><rect x="446" y="249" width="128" height="30" rx="15.0" fill="#D9614E" stroke="#D9614E" stroke-width="0"/><text x="510.0" y="269.6666666666667" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">cancellations</text><rect x="582" y="249" width="96" height="30" rx="15.0" fill="#D9614E" stroke="#D9614E" stroke-width="0"/><text x="630.0" y="269.6666666666667" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">illness</text><rect x="28" y="316" width="664" height="62" rx="14" fill="#FBE7E3" stroke="#FBE7E3" stroke-width="0"/><text x="360" y="354" font-size="17" font-weight="700" fill="#A3402F" text-anchor="middle">Explain why hours were lower, for example cancellations or illness.</text>
</svg>
