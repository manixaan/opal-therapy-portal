<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A worked goal for a made-up client, Sam: the goal, the therapy plan strategy, progress, the barrier and the recommendation</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Worked example: one goal</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Made-up client · example only</text><rect x="28" y="92" width="322" height="110" rx="16" fill="#fff" stroke="#23395B" stroke-width="2.5"/><rect x="44" y="104" width="110" height="28" rx="14.0" fill="#23395B" stroke="#23395B" stroke-width="0"/><text x="99.0" y="124.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Goal</text><text x="46" y="154" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">Prepare simple meals independently</text><rect x="370" y="92" width="322" height="110" rx="16" fill="#fff" stroke="#14988A" stroke-width="2.5"/><rect x="386" y="104" width="110" height="28" rx="14.0" fill="#14988A" stroke="#14988A" stroke-width="0"/><text x="441.0" y="124.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Strategy</text><text x="388" y="154" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">Step-by-step task practice and</text><text x="388" y="175" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">kitchen set-up changes</text><rect x="28" y="212" width="322" height="110" rx="16" fill="#fff" stroke="#E3A03A" stroke-width="2.5"/><rect x="44" y="224" width="110" height="28" rx="14.0" fill="#E3A03A" stroke="#E3A03A" stroke-width="0"/><text x="99.0" y="244.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Progress</text><text x="46" y="274" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">Makes a sandwich and a hot drink</text><text x="46" y="295" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">with set-up only. Hot stove tasks</text><text x="46" y="316" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">not yet started.</text><rect x="370" y="212" width="322" height="110" rx="16" fill="#fff" stroke="#D9614E" stroke-width="2.5"/><rect x="386" y="224" width="110" height="28" rx="14.0" fill="#D9614E" stroke="#D9614E" stroke-width="0"/><text x="441.0" y="244.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Barrier</text><text x="388" y="274" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">Several sessions cancelled due to</text><text x="388" y="295" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">illness, so practice time was</text><text x="388" y="316" font-size="16" font-weight="500" fill="#1E2B2F" text-anchor="start">lower. The report says so.</text><rect x="28" y="332" width="664" height="58" rx="16" fill="#ECEAFA" stroke="#6C63C9" stroke-width="2.5"/><rect x="44" y="346" width="150" height="30" rx="15.0" fill="#6C63C9" stroke="#6C63C9" stroke-width="0"/><text x="119.0" y="367.0" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Recommendation</text><text x="208" y="362" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">Continue meal preparation practice in the next plan,</text><text x="208" y="381" font-size="15" font-weight="600" fill="#1E2B2F" text-anchor="start">with evidence from an assessment of stove safety.</text>
</svg>
