<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Each NDIS goal links to therapy plan strategies, then to progress or barriers, then to a recommendation for the next plan</title>
  <rect width="720" height="405" rx="22" fill="#F7F6F2"/>
<text x="28" y="50" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="start">Goal by goal</text><text x="28" y="80" font-size="18" font-weight="500" fill="#6B7C80" text-anchor="start">Every goal links back to the therapy plan</text><rect x="24" y="120" width="150" height="150" rx="18" fill="#fff" stroke="#23395B" stroke-width="3"/><circle cx="99" cy="164" r="22" fill="#23395B"/><text x="99" y="171" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="99" y="218" font-size="20" font-weight="800" fill="#23395B" text-anchor="middle">NDIS goal</text><text x="99" y="244" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">from the plan</text><path d="M178 195 H190" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M184 184 L198 195 L184 206" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="200" y="120" width="150" height="150" rx="18" fill="#fff" stroke="#14988A" stroke-width="3"/><circle cx="275" cy="164" r="22" fill="#14988A"/><text x="275" y="171" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="275" y="218" font-size="20" font-weight="800" fill="#14988A" text-anchor="middle">Therapy plan</text><text x="275" y="244" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">strategies</text><path d="M354 195 H366" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M360 184 L374 195 L360 206" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="376" y="120" width="150" height="150" rx="18" fill="#fff" stroke="#E3A03A" stroke-width="3"/><circle cx="451" cy="164" r="22" fill="#E3A03A"/><text x="451" y="171" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="451" y="218" font-size="20" font-weight="800" fill="#8A5A12" text-anchor="middle">Progress</text><text x="451" y="244" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">or barriers</text><path d="M530 195 H542" stroke="#0D5E57" stroke-width="5" stroke-linecap="round"/><path d="M536 184 L550 195 L536 206" fill="none" stroke="#0D5E57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="552" y="120" width="150" height="150" rx="18" fill="#fff" stroke="#6C63C9" stroke-width="3"/><circle cx="627" cy="164" r="22" fill="#6C63C9"/><text x="627" y="171" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="627" y="218" font-size="20" font-weight="800" fill="#6C63C9" text-anchor="middle">Next plan</text><text x="627" y="244" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">recommendation</text><rect x="24" y="300" width="672" height="74" rx="14" fill="#fff" stroke="#E2DDD3" stroke-width="2"/><text x="360" y="332" font-size="19" font-weight="700" fill="#1E2B2F" text-anchor="middle">Limited progress? Say so plainly — and explain the barriers.</text><text x="360" y="358" font-size="16" font-weight="500" fill="#6B7C80" text-anchor="middle">A planner needs to see what was tried and what did not work.</text>
</svg>
