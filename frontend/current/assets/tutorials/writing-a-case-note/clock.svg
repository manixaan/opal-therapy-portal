  <circle cx="60" cy="209" r="22" fill="#0D5E57" stroke="#FBF8F3" stroke-width="5"/>
  <path d="M50 209 L57 216 L70 202" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
