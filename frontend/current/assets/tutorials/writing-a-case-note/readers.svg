<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Four readers around one case note: auditors who check it against the activity, colleagues who may continue the care, participants and families who may receive a copy, and you</title>
  <rect width="720" height="405" rx="22" fill="#FBF8F3"/>
  <text x="360" y="46" font-size="28" font-weight="800" fill="#1E2B2F" text-anchor="middle">Who reads your notes</text>
  <g stroke="#CFC8BB" stroke-width="3" stroke-dasharray="6 7"><path d="M286 130 L318 168"/><path d="M434 130 L402 168"/><path d="M286 300 L318 266"/><path d="M434 300 L402 266"/></g>
  <g transform="translate(312,148)">
    <rect width="96" height="132" rx="12" fill="#fff" stroke="#14988A" stroke-width="3"/>
    <rect x="14" y="20" width="68" height="9" rx="4.5" fill="#14988A"/>
    <rect x="14" y="42" width="56" height="7" rx="3.5" fill="#CFE9E5"/><rect x="14" y="58" width="68" height="7" rx="3.5" fill="#CFE9E5"/>
    <rect x="14" y="80" width="68" height="9" rx="4.5" fill="#E3A03A"/><rect x="14" y="100" width="48" height="7" rx="3.5" fill="#F4E1BE"/>
  </g>
  <g font-size="22" font-weight="700">
    <g transform="translate(16,74)"><rect width="270" height="108" rx="16" fill="#E3F4F1"/><circle cx="42" cy="54" r="24" fill="#14988A"/><circle cx="39" cy="51" r="10" fill="none" stroke="#fff" stroke-width="4"/><path d="M46 58 L54 66" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="80" y="40" fill="#0D5E57">Auditors</text><text x="80" y="66" font-size="16" font-weight="500" fill="#3D5A54">check it against</text><text x="80" y="87" font-size="16" font-weight="500" fill="#3D5A54">the activity</text></g>
    <g transform="translate(434,74)"><rect width="270" height="108" rx="16" fill="#FDF1DC"/><circle cx="42" cy="54" r="24" fill="#E3A03A"/><circle cx="35" cy="46" r="6" fill="#fff"/><circle cx="50" cy="46" r="6" fill="#fff"/><path d="M25 67 a10 10 0 0 1 20 0 z" fill="#fff"/><path d="M40 67 a10 10 0 0 1 20 0 z" fill="#fff"/><text x="80" y="40" fill="#8A5A12">Colleagues</text><text x="80" y="66" font-size="16" font-weight="500" fill="#3D5A54">may continue the</text><text x="80" y="87" font-size="16" font-weight="500" fill="#3D5A54">participant's care</text></g>
    <g transform="translate(16,256)"><rect width="270" height="108" rx="16" fill="#ECEAFA"/><circle cx="42" cy="54" r="24" fill="#6C63C9"/><path d="M42 66 C30 56 28 48 34 43 C38 40 42 43 42 47 C42 43 46 40 50 43 C56 48 54 56 42 66 Z" fill="#fff"/><text x="80" y="40" fill="#463E9E">Participants</text><text x="80" y="66" font-size="16" font-weight="500" fill="#3D5A54">and families may</text><text x="80" y="87" font-size="16" font-weight="500" fill="#3D5A54">receive a copy</text></g>
    <g transform="translate(434,256)"><rect width="270" height="108" rx="16" fill="#FBE7E3"/><circle cx="42" cy="54" r="24" fill="#D9614E"/><path d="M33 64 L35 56 L50 41 L56 47 L41 62 Z" fill="#fff"/><text x="80" y="40" fill="#A3402F">You</text><text x="80" y="66" font-size="16" font-weight="500" fill="#3D5A54">use it later for</text><text x="80" y="87" font-size="16" font-weight="500" fill="#3D5A54">progress reports</text></g>
  </g>
</svg>
