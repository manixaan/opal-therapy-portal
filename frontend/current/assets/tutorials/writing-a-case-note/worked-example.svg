<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A worked example case note for a made-up client, Sam Example, with each must-have ticked off</title>
  <rect width="720" height="405" rx="22" fill="#FBF8F3"/>
  <g transform="translate(20,14)">
    <rect width="452" height="376" rx="16" fill="#fff" stroke="#E2DDD3"/>
    <text x="22" y="34" font-size="14" font-weight="700" fill="#6B7C80" letter-spacing="1">MADE-UP CLIENT · EXAMPLE ONLY</text>
    <rect x="16" y="48" width="5" height="82" rx="2.5" fill="#14988A"/>
    <text x="32" y="66" font-size="17" font-weight="800" fill="#0D5E57">Identity</text>
    <g font-size="14.5" fill="#1E2B2F"><text x="32" y="88">Therapy session with Sam Example. 12 March.</text><text x="32" y="108">Held at Sam's home. Present: Sam, Sam's</text><text x="32" y="128">mother and the therapist.</text></g>
    <rect x="16" y="142" width="5" height="122" rx="2.5" fill="#E3A03A"/>
    <text x="32" y="160" font-size="17" font-weight="800" fill="#8A5A12">Assessment</text>
    <g font-size="14.5" fill="#1E2B2F"><text x="32" y="182">Sam practised using a built-up spoon at lunch.</text><text x="32" y="202">He needed one verbal prompt to hold it steadily.</text><text x="32" y="222">He fed himself most of the meal and said he</text><text x="32" y="242">felt "good" about it. Opening a lunch container</text><text x="32" y="262">was still difficult.</text></g>
    <rect x="16" y="276" width="5" height="82" rx="2.5" fill="#6C63C9"/>
    <text x="32" y="294" font-size="17" font-weight="800" fill="#463E9E">Plan</text>
    <g font-size="14.5" fill="#1E2B2F"><text x="32" y="316">Next session 19 March. Practise the spoon at two</text><text x="32" y="336">meals. Billed: 50 min session, 10 min case</text><text x="32" y="356">noting, 30 min travel.</text></g>
  </g>
  <g font-size="18" font-weight="700" fill="#1E2B2F">
    <text x="498" y="54" font-size="21" font-weight="800">All six included</text>
    <g transform="translate(498,80)"><circle cx="14" cy="14" r="14" fill="#14988A"/><path d="M7 14 L12 19 L21 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="21">Date</text></g>
    <g transform="translate(498,124)"><circle cx="14" cy="14" r="14" fill="#14988A"/><path d="M7 14 L12 19 L21 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="21">Participant</text></g>
    <g transform="translate(498,168)"><circle cx="14" cy="14" r="14" fill="#14988A"/><path d="M7 14 L12 19 L21 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="21">Location</text></g>
    <g transform="translate(498,212)"><circle cx="14" cy="14" r="14" fill="#14988A"/><path d="M7 14 L12 19 L21 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="21">Who was present</text></g>
    <g transform="translate(498,256)"><circle cx="14" cy="14" r="14" fill="#E3A03A"/><path d="M7 14 L12 19 L21 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="21">What was done</text></g>
    <g transform="translate(498,300)"><circle cx="14" cy="14" r="14" fill="#6C63C9"/><path d="M7 14 L12 19 L21 9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="21">Billed time</text></g>
    <text x="498" y="356" font-size="16" font-weight="600" fill="#6B7C80">Specific · factual ·</text><text x="498" y="376" font-size="16" font-weight="600" fill="#6B7C80">easy to follow</text>
  </g>
</svg>
